description = "Quantize and publish LLM artifacts with llmcompressor-based workflows"
requires-python = ">=3.13,<3.14"
dependencies = [
  "transformers==4.57.6",
  "accelerate==1.12.0",
  "optimum==2.1.0",
  "llmcompressor==0.10.0.1",
  "compressed-tensors==0.14.0.1",
  "huggingface_hub==0.36.2",
  "torch==2.10.0",
  "pyyaml==6.0.3",
  "safetensors==0.7.0",
]

[tool.uv]
package = false
